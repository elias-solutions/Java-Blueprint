spring.application.name=springboot-java-blueprint
server.port=5105

spring.datasource.url=jdbc:h2:mem:blueprint;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.jackson.mapper.accept-case-insensitive-properties=true
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger

blueprint.rate-limit.permit-limit=4
blueprint.rate-limit.window=5s
blueprint.rate-limit.queue-limit=2
