spring.application.name=springboot-java-blueprint
server.port=5105

spring.datasource.url=jdbc:postgresql://localhost:5432/blueprint_java
spring.datasource.username=blueprint
spring.datasource.password=blueprint
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.mapper.accept-case-insensitive-properties=true
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger

blueprint.rate-limit.permit-limit=4
blueprint.rate-limit.window=5s
blueprint.rate-limit.queue-limit=2

# Keycloak realm "blueprint" (see docker/keycloak). Tokens must carry the audience
# "blueprint-api"; realm roles arrive in the flat "roles" claim.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/blueprint
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=blueprint-api
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username
